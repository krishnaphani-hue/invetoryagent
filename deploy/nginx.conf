# FUTURE USE ONLY: nginx in front of the app on a hosted server (not needed on the laptop).
# nginx only adds HTTPS and forwards everything to the app. The app already serves both the dashboard
# and the API, so URLs are identical with or without nginx:
#   laptop:  http://localhost:8080/api/v1/inventory
#   server:  https://inventory.example.com/api/v1/inventory   (only the agent's ServerUrl changes)
#
# Linux: copy to /etc/nginx/conf.d/asset-inventory.conf, set server_name and certificate paths,
# keep the app on HOST=127.0.0.1 APP_PORT=8080 (only nginx can reach it), then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name inventory.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name inventory.example.com;

    ssl_certificate     /etc/ssl/certs/inventory.crt;
    ssl_certificate_key /etc/ssl/private/inventory.key;

    client_max_body_size 25m;   # Excel uploads (MAX_UPLOAD_MB=20) and large agent batches

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
