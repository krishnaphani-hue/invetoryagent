# FUTURE USE ONLY: for a Linux server where Docker is allowed. Not used or tested on the dev laptop.
# See README.md, "Deploying to a server". nginx runs on the host in front of the app.
# Run from the repo root:  docker compose -f deploy/docker-compose.yml up -d --build
# Set POSTGRES_PASSWORD in the environment or in a .env file next to this file first.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: asset_inventory
      POSTGRES_USER: inventory_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_app -d asset_inventory"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://inventory_app:${POSTGRES_PASSWORD}@db:5432/asset_inventory
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      INGEST_API_KEY: ${INGEST_API_KEY:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"   # only nginx on this host can reach the app (see deploy/nginx.conf)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
